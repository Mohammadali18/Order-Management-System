<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Order Management System</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: linear-gradient(135deg, #1d2b64, #f8cdda);
    min-height: 100vh;
    padding: 20px;
    color: #333;
}

/* HEADER */
.header {
    text-align: center;
    margin-bottom: 20px;
    color: white;
}

.header h1 {
    font-size: 32px;
}

.header p {
    font-size: 14px;
    opacity: 0.9;
}

/* CONTAINER */
.container {
    max-width: 1000px;
    margin: auto;
}

/* GRID */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    margin-bottom: 20px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(10px);
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-6px) scale(1.02);
}

.card h3 {
    margin-bottom: 10px;
}

/* INPUT & SELECT */
input, select {
    width: 100%;
    padding: 8px;
    margin-bottom: 10px;
    border-radius: 6px;
    border: 1px solid #ccc;
    transition: 0.3s;
}

input:focus, select:focus {
    border-color: #6a11cb;
    box-shadow: 0 0 5px #6a11cb;
    outline: none;
}

/* BUTTON */
button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 6px;
    background: linear-gradient(45deg, #ff512f, #dd2476);
    color: white;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    background: linear-gradient(45deg, #24c6dc, #514a9d);
}

/* TABLE */
.table-container {
    background: white;
    border-radius: 12px;
    padding: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th {
    background: #6a11cb;
    color: white;
    padding: 10px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:hover td {
    background: #f2f2f2;
}

/* STATUS COLORS */
.status {
    padding: 6px 12px;
    border-radius: 20px;
    color: white;
    font-size: 12px;
    font-weight: bold;
}

.pending {
    background: orange;
}

.shipped {
    background: #007bff;
}

.delivered {
    background: green;
}

.order-confirmed {
    background: purple;
}

.cancelled {
    background: red;
}

/* ANIMATION */
.fade-in {
    animation: fadeIn 0.6s ease-in;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(10px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>
</head>

<body>

<div class="header">
    <h1>🚀 Order Management System</h1>
    <p>Advanced CRUD application using Flask & MySQL</p>
</div>

<div class="container">

    <div class="grid fade-in">

        <!-- CREATE -->
        <div class="card">
            <h3>📦 Create Order</h3>
            <input type="text" id="item" placeholder="Enter item">
            <button onclick="createOrder()">Add Order</button>
        </div>

        <!-- UPDATE -->
        <div class="card">
            <h3>✏️ Update Status</h3>
            <input type="number" id="updateId" placeholder="Order ID">
            
            <select id="status">
                <option value="Pending">Pending</option>
                <option value="Shipped">Shipped</option>
                <option value="Delivered">Delivered</option>
                <option value="Order Confirmed">Order Confirmed</option>
                <option value="Cancelled">Cancelled</option>
            </select>

            <button onclick="updateOrder()">Update</button>
        </div>

        <!-- DELETE -->
        <div class="card">
            <h3>🗑️ Delete Order</h3>
            <input type="number" id="deleteId" placeholder="Order ID">
            <button onclick="deleteOrder()">Delete</button>
        </div>

        <!-- REFRESH -->
        <div class="card">
            <h3>🔄 Refresh Orders</h3>
            <button onclick="loadOrders()">Load Orders</button>
        </div>

    </div>

    <!-- TABLE -->
    <div class="table-container fade-in">
        <table id="orderTable">
            <tr>
                <th>ID</th>
                <th>Item</th>
                <th>Status</th>
            </tr>
        </table>
    </div>

</div>

<script>
function createOrder() {
    let itemInput = document.getElementById('item');

    fetch('/orders', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({item: itemInput.value})
    })
    .then(res => res.json())
    .then(() => {
        itemInput.value = "";  // clear input
        loadOrders();
    });
}

function loadOrders() {
    fetch('/orders')
    .then(res => res.json())
    .then(data => {
        let table = document.getElementById('orderTable');

        table.innerHTML = `
            <tr>
                <th>ID</th>
                <th>Item</th>
                <th>Status</th>
            </tr>
        `;

        data.forEach(order => {
            let statusClass = order.status.toLowerCase().replace(" ", "-");

            table.innerHTML += `
                <tr>
                    <td>${order.id}</td>
                    <td>${order.item}</td>
                    <td>
                        <span class="status ${statusClass}">
                            ${order.status}
                        </span>
                    </td>
                </tr>
            `;
        });
    });
}

function updateOrder() {
    let id = document.getElementById('updateId').value;
    let status = document.getElementById('status').value;

    fetch(`/orders/${id}`, {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({status: status})
    })
    .then(() => loadOrders());
}

function deleteOrder() {
    let id = document.getElementById('deleteId').value;

    fetch(`/orders/${id}`, {
        method: 'DELETE'
    })
    .then(() => loadOrders());
}
</script>

</body>
</html>
